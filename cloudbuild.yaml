steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${_PROJECT_ID}/varavu-selavu-backend', '.']
    dir: 'varavu_selavu_app'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${_PROJECT_ID}/varavu-selavu-frontend', '.']
    dir: 'varavu_selavu_ui'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_PROJECT_ID}/varavu-selavu-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_PROJECT_ID}/varavu-selavu-frontend']

  # Run pending Alembic migrations against the prod DB, using the image just
  # built/pushed above so the migration set always matches the code about to
  # be deployed. Runs *before* the deploy steps so new code never queries a
  # table/column that doesn't exist yet. Fixes the gap that let the `budgets`
  # feature ship with its table never created in prod: migrations used to be
  # a manual, undocumented step run by hand against prod from someone's own
  # machine.
  #
  # Delegates to a Cloud Run Job rather than running `alembic` directly in
  # this Cloud Build step: confirmed by testing directly that Cloud Build's
  # default worker pool cannot reach the Supabase host over IPv6
  # ("OperationalError: Cannot assign requested address"). Cloud Run's own
  # networking — already proven by the backend service itself — doesn't have
  # that problem, so the migration runs there instead. `migrate-db` is a
  # standing job resource, re-pointed at the freshly built image and
  # re-executed on every deploy.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-migrations'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        gcloud run jobs deploy migrate-db \
          --image=gcr.io/${_PROJECT_ID}/varavu-selavu-backend \
          --region=${_REGION} \
          --command=bash \
          --args="-c,cd /app && alembic upgrade head" \
          --set-secrets=DATABASE_URL=SUPABASE_PG_DB_URL:latest \
          --service-account=varavu-selavu-seyali@${_PROJECT_ID}.iam.gserviceaccount.com \
          --max-retries=0
        gcloud run jobs execute migrate-db --region=${_REGION} --wait

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=gcr.io/${_PROJECT_ID}/varavu-selavu-backend'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_FRONTEND_SERVICE}'
      - '--image=gcr.io/${_PROJECT_ID}/varavu-selavu-frontend'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'us-central1'
  _PROJECT_ID: 'gold-circlet-424313-r7'
  _BACKEND_SERVICE: 'varavu-selavu-backend'
  _FRONTEND_SERVICE: 'varavu-selavu-frontend'
