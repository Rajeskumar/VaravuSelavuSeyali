server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Edge security headers — nothing upstream of this (Cloudflare) is known to set these, and
  # nothing in the app itself did either, so they were entirely absent on every response.
  #
  # CSP note: 'unsafe-inline' is required in script-src for the gtag.js bootstrap snippet in
  # index.html, and in style-src for MUI/emotion, which injects <style> tags at runtime rather
  # than using nonces. That weakens the policy against inline-script injection specifically, but
  # it still meaningfully restricts *which origins* can load script/style/connect/frame at all,
  # blocks plugins (object-src), and blocks framing (frame-ancestors, redundant with
  # X-Frame-Options on purpose — belt and suspenders across browsers with different support).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://trackspense-api.cerebroos.com https://*.run.app https://www.google-analytics.com https://*.analytics.google.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
