server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Edge security headers — nothing upstream of this (Cloudflare) is known to set these, and
  # nothing in the app itself did either, so they were entirely absent on every response.
  #
  # CSP note: scripts are 'self' plus the specific Google hosts below — no 'unsafe-inline'
  # (the analytics stub is a file and the build runs with INLINE_RUNTIME_CHUNK=false). Styles
  # still need 'unsafe-inline' because MUI/emotion injects <style> tags at runtime without nonces;
  # that is a much smaller exposure than inline script. Fonts are served from this origin.
  # connect-src names the one API host; the mobile apps don't run through this page.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://trackspense-api.cerebroos.com https://www.google-analytics.com https://*.analytics.google.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
