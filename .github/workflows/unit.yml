name: Unit tests

# Fast, server-free checks that no other gate runs: web lint + typecheck + Jest, mobile
# typecheck + Jest, and the backend pytest suite. (qa.yml covers the browser/API suites; the
# pre-push hook runs backend pytest + audits only.) Three independent jobs so a web failure
# doesn't hide a mobile one. Unlike qa.yml this is not path-filtered: mobile-only changes still
# need the mobile job, and each job is cheap.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: varavu_selavu_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: varavu_selavu_ui/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src --ext .ts,.tsx
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Jest
        run: npx react-scripts test --watchAll=false --ci
        env:
          CI: 'true'

  mobile:
    name: Mobile (typecheck, Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: varavu_selavu_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: varavu_selavu_mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Jest
        run: npx jest --ci

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: varavu_selavu_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('varavu_selavu_app/poetry.lock') }}
      - run: poetry install --no-root
      - name: pytest
        run: poetry run pytest -q

  mcp-postgres:
    name: MCP PostgreSQL transactions and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: varavu_selavu_app
    env:
      E2E_DATABASE_URL: postgresql://mcp_test:local_test_password@localhost:5432/mcp_test
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/test_mcp*pg.py -q

  backend-postgres:
    # B-18: the SQL that only behaves differently on PostgreSQL (analytics aggregation, group
    # balances, AI quota counters). Mirrors varavu_selavu_app/run_e2e_pg_tests.sh without Docker.
    name: Backend PostgreSQL (analytics, groups, AI quota)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vs_test
          POSTGRES_PASSWORD: vs_test_pass
          POSTGRES_DB: tracking_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: varavu_selavu_app
    env:
      E2E_DATABASE_URL: postgresql://vs_test:vs_test_pass@localhost:5432/tracking_db
      PGPASSWORD: vs_test_pass
      ENVIRONMENT: local
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Create schema and extension
        run: |
          psql -h localhost -U vs_test -d tracking_db -c "CREATE SCHEMA IF NOT EXISTS trackspense;"
          psql -h localhost -U vs_test -d tracking_db -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Create tables from the models
        run: |
          poetry run python -c "
          from sqlalchemy import create_engine
          from varavu_selavu_service.db.session import Base
          from varavu_selavu_service.db import models  # registers every table on Base.metadata
          Base.metadata.create_all(bind=create_engine('$E2E_DATABASE_URL'))
          print('tables created')
          "
      # One pytest process per file: these modules install their own app-wide dependency overrides
      # at import time, so loading them together makes one run as the other's user.
      - name: PostgreSQL-only tests
        run: |
          poetry run pytest tests/test_analytics_e2e_pg.py -q
          poetry run pytest tests/test_groups_e2e_pg.py -q
          poetry run pytest "tests/test_ai_quota.py::test_concurrent_reserves_never_overshoot_on_postgres" -q

  test-integrity:
    # Deterministic backstop for "never weaken tests": deleted test files, new skip/only/xfail
    # markers and net assertion loss fail unless a commit in the range carries a
    # `Test-Change-Approved: <reason>` trailer (scripts/quality/test_integrity.py).
    name: Test integrity (no weakened tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the change range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/quality/test_integrity.py --range "$PR_BASE" "$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            python3 scripts/quality/test_integrity.py --range "$BEFORE" "$GITHUB_SHA"
          else
            # Manual dispatch / new branch: compare with the last release, never skip (a dispatch
            # run can be the newest unit.yml run that release-gate accepts for the candidate).
            BASE_TAG="$(git describe --tags --abbrev=0 --match 'release-v*' 2>/dev/null || true)"
            if [ -z "$BASE_TAG" ]; then echo "No release tag to compare against" >&2; exit 1; fi
            python3 scripts/quality/test_integrity.py --range "$BASE_TAG" "$GITHUB_SHA"
          fi

  security:
    # Secret scanning and dependency audits on every PR and main push, so a vulnerable lockfile
    # or leaked key shows up on the PR instead of at release time (Cloud Build re-audits).
    name: Security (secret scan, dependency audits)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (tracked files)
        run: python3 scripts/quality/secret_scan.py
      - name: Secret scan (commits in this push/PR)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2 (v2.3.9)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'  # read-only token: report in the job log, never fail on commenting
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install poetry
      - name: Install backend dependencies (pip-audit audits the installed environment)
        working-directory: varavu_selavu_app
        run: poetry install --no-interaction
      - name: Dependency audits (backend, web, mobile allowlist, qa)
        run: make audit-all
