[project]
name = "varavu-selavu-app"
version = "0.1.0"
description = "FastAPI backend for TrackSpense by Cerebroos"
authors = [
    {name = "Rajesh Kumar Ganesan"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "plotly (>=6.2.0,<7.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    # Security floors for transitive deps that otherwise resolve to advisory-carrying
    # versions (urllib3/idna via requests, cryptography via google-auth, aiohttp+ujson via
    # the langchain stack). Raise, never pin, so patches keep flowing.
    # starlette: fastapi sets no upper bound, so raise it explicitly to clear its own
    # advisories. limits: slowapi caps nothing, and limits<3 imports pkg_resources, which
    # setuptools>=81 no longer ships -- that coupling is why setuptools was pinned <70.
    "pyasn1 (>=0.6.3)",
    "pygments (>=2.20.0)",
    "python-dotenv (>=1.2.2)",
    "starlette (>=1.6.0)",
    "limits (>=5.8.0)",
    "urllib3 (>=2.7.0)",
    "idna (>=3.19)",
    "cryptography (>=50.0.1)",
    "aiohttp (>=3.14.3)",
    "ujson (>=6.0.0)",
    "click (>=8.5.0)",
    "filelock (>=3.32.6)",
    "bcrypt (>=4.1.2,<5.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.1.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "google-auth (>=2.49.0,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "alembic (<1.14.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "setuptools (>=84.0.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-openai (>=1.3.3,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph (>=1.2.6,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-google-genai (>=4.2.6,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [
    { include = "varavu_selavu_service" }
]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-env = "<1.0.0"
testing-postgresql = "^1.3.0"
psycopg2-binary = "^2.9.11"

