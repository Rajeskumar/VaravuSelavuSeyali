# SCENARIO AC-005 (JM-04) regression: an invite link opened while SIGNED OUT is handled safely
# LOGINS: 1
# Preconditions: the runner's user is the invitee, signed out; an owner's group with an invite token (seed).
# Native interactions: open the invite link on the sign-in screen, then sign in.
# Assertions (UI): the app does not crash or join anyone silently: the sign-in screen stays, sign-in works, Home loads.
#   Persisted (verify): the invitee is NOT a member (nothing was joined without a decision).
# KNOWN GAP (finding F-014, not built here): the web app remembers the invite across sign-in and resumes it; mobile has no
#   pending-invite handling (JoinGroup exists only in the signed-in stack), so the link is dropped. When mobile resumes the
#   invite, change this flow to expect the "You've been invited" screen after sign-in.
# Reset/cleanup: none (own users/group, disposable DB). Platforms: iOS, Android.
appId: com.cerebroos.trackspense
tags:
  - regression
---
- runFlow: ../../subflows/launch-clean.yaml
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: "trackspense://join/${INVITE_TOKEN}"
- assertVisible:
    id: "login.email"
- runFlow: ../../subflows/login.yaml
- assertVisible:
    id: "home.greeting"
